<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#031a12"/>
      <stop offset="0.5" stop-color="#06301f"/>
      <stop offset="1" stop-color="#0b3d2b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d1fae5" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#6ee7b7" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ecfdf5" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef9c3" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#fde68a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="grain2">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#night)"/>
  <g filter="url(#blur)">
    <circle cx="300" cy="240" r="300" fill="#0d9488" opacity="0.35"/>
    <circle cx="1320" cy="780" r="360" fill="#166534" opacity="0.55"/>
    <circle cx="1180" cy="180" r="160" fill="url(#lamp)"/>
  </g>
  <g stroke="#d1fae5" stroke-opacity="0.12" stroke-width="1.5">
    <rect x="120" y="140" width="520" height="720" rx="28" fill="url(#panel)"/>
    <rect x="700" y="-60" width="360" height="900" rx="24" fill="#ecfdf5" opacity="0.04"/>
    <rect x="1140" y="330" width="420" height="730" rx="30" fill="url(#panel)"/>
  </g>
  <path d="M120 720 L 640 480" stroke="#a7f3d0" stroke-opacity="0.25" stroke-width="2"/>
  <path d="M700 300 L 1060 180" stroke="#a7f3d0" stroke-opacity="0.20" stroke-width="2"/>
  <path d="M1140 620 L 1560 460" stroke="#a7f3d0" stroke-opacity="0.18" stroke-width="2"/>
  <rect width="1600" height="1000" filter="url(#grain2)"/>
</svg>
